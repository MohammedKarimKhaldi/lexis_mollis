[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfkb"
version = "2.0.1"
description = "Pipeline OCR local, multilingue et auditable pour corpus PDF"
requires-python = ">=3.11"
dependencies = [
  "PyMuPDF>=1.27",
  "Pillow>=12",
  "numpy>=2",
  "opencv-python>=4.13",
  "pytesseract>=0.3.13",
  "langdetect>=1.0.9",
  "tqdm>=4.68",
  "pyobjc-framework-Vision>=12; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz>=12; sys_platform == 'darwin'",
]

[project.optional-dependencies]
derive = [
  "sentence-transformers>=3.0",
  "faiss-cpu>=1.8",
  "datasketch>=1.6",
  "networkx>=3.2",
  "python-louvain>=0.16",
  "pyarrow>=15",
  "rdflib>=7",
  "numpy>=2",
  "tqdm>=4.68",
  "scikit-learn>=1.4",
  "regex>=2024.0",
  "jsonschema>=4.22",
  "PyYAML>=6.0",
]
dev = [
  "ruff==0.16.2",
]
semantica = [
  "semantica[explorer]==0.6.0",
]

[project.scripts]
pdfkb = "pdfkb.cli:main"

[tool.setuptools.packages.find]
include = ["pdfkb*"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["epics", "legacy"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "C4", "SIM", "UP", "PERF", "RUF", "ARG", "SLF", "N", "BLE001"]
# RUF001: the corpus and its regexes intentionally match French/OCR typography
# (curly quotes, en dashes) -- not mistaken lookalikes.
# SIM905: would collapse readable, space-wrapped stopword lists into a single
# unreadable list-literal line.
# SIM108: the suggested ternary rewrites nest two conditionals into one line,
# less readable than the if/else block they replace.
ignore = ["RUF001", "SIM905", "SIM108"]
